name: Backend and frontend deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: sudeeppatgar/forgeflow/.github/workflows/reusable-node-ci.yml@main
    with:
      node-version: '22'

  deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    uses: sudeeppatgar/forgeflow/.github/workflows/reusable-render-deploy.yml@main
    secrets:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  deploy-frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    uses: sudeeppatgar/forgeflow/.github/workflows/reusable-netlify-deploy.yml@main
    with:
      node-version: '22'
      publish-dir: company-dashboard/dist
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
